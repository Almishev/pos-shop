# Test Configuration — H2 in-memory (do not override via CI env SPRING_DATASOURCE_*)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.h2.console.enabled=false

# Match main app property names
aws.access.key=test-access-key
aws.secret.key=test-secret-key
aws.region=eu-central-1
aws.bucket.name=test-bucket

jwt.secret.key=test-secret-key-for-jwt-billing-software-tests

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

card.terminal.simulate=true
fiscal.device.main.serial=TEST123456789
fiscal.device.main.name=Test Device

logging.level.root=WARN
logging.level.in.bushansirgur.billingsoftware=INFO
