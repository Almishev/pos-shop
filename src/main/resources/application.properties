# Orders archiving settings (ENABLED for manual operations)
orders.archive.enabled=true
orders.archive.retentionMonths=${ORDERS_ARCHIVE_RETENTION_MONTHS:6}
orders.archive.bucket=${ORDERS_ARCHIVE_BUCKET:my-pos-orders}
orders.archive.prefix=${ORDERS_ARCHIVE_PREFIX:orders}
orders.archive.schedule.cron=${ORDERS_ARCHIVE_SCHEDULE_CRON:0 0 3 1 * *}

# Reports export settings (DAILY EXPORT DISABLED)
reports.s3.bucket=${REPORTS_S3_BUCKET:pos-reports-supermarket}
reports.s3.prefix=${REPORTS_S3_PREFIX:reports}
reports.daily.enabled=false
reports.daily.schedule.cron=${REPORTS_DAILY_SCHEDULE_CRON:0 0 0 * * *}


# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_app}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user1}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:asroma}

# Your PostgreSQL database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_app
spring.datasource.username=user1
spring.datasource.password=asroma

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.servlet.context-path=/api/v1.0

# CORS Configuration
# Allow access from localhost and network IP addresses
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173,http://192.168.80.101:3001,http://192.168.80.120:3001}

# File upload configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

aws.access.key=${AWS_ACCESS_KEY:}
aws.secret.key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-central-1}
aws.bucket.name=${AWS_BUCKET_NAME:}

jwt.secret.key=${JWT_SECRET_KEY:thisismysecretkeyfortheupcomingproject}

# RAZORPAY CONFIGURATION
razorpay.key.id=${RAZORPAY_KEY_ID:disabled}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:disabled}

# Card terminal settings
card.terminal.simulate=${CARD_TERMINAL_SIMULATE:true}
card.terminal.timeout=${CARD_TERMINAL_TIMEOUT:30000}
card.terminal.default.id=${CARD_TERMINAL_DEFAULT_ID:TERMINAL_001}
card.terminal.merchant.id=${CARD_TERMINAL_MERCHANT_ID:DEMO_MERCHANT}
card.terminal.api.endpoint=${CARD_TERMINAL_API_ENDPOINT:https://api.terminal-provider.com}
card.terminal.api.key=${CARD_TERMINAL_API_KEY:your-api-key-here}
card.terminal.api.secret=${CARD_TERMINAL_API_SECRET:your-api-secret-here}

# Main fiscal device for store-wide reports
fiscal.device.main.serial=${FISCAL_DEVICE_MAIN_SERIAL:TEST123456789}
fiscal.device.main.name=${FISCAL_DEVICE_MAIN_NAME:Главно фискално устройство}

server.port=8087